<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    
    <!-- ============================================================================
         🌐 BEZPEČNÉ NAČTENÍ FIREBASE (ABY NEVZNIKALA CHYBA NOT DEFINED)
         ============================================================================ -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>

    <title>Milanek a Verca: Cesta k oltari</title>
    <style>
        body {
            margin: 0;
            background-color: #fdf2f8;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            box-sizing: border-box;
            /* Zabrání nechtěnému označování textu a přibližování stránky na mobilu */
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }
        h1 {
            color: #d63384;
            text-align: center;
            margin-bottom: 10px;
            font-size: 5vw; /* Velikost písma se přizpůsobí displeji */
            max-size: 24px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }
        #gameCanvas {
            border: 4px solid #d63384;
            border-radius: 10px;
            background-color: #bae6fd;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            /* Šířka plátna se přizpůsobí mobilu, maximálně však 800px */
            width: 100%;
            max-width: 800px;
            height: auto;
        }
        #difficultyMenu {
            margin-top: 15px;
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 800px;
            justify-content: center;
            flex-wrap: wrap; /* Na malých mobilech se tlačítka naskládají pod sebe */
        }
        #difficultyMenu button {
            color: white;
            border: none;
            padding: 12px 16px; /* Trochu větší pro pohodlné mačkání prstem */
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            flex: 1;
            min-width: 100px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
            background-color: white;
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>💍 Milanek &amp; Verca: Cesta k oltari 💍</h1>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="difficultyMenu" style="margin-top: 15px; display: flex; gap: 10px;">
        <button onclick="setDifficulty('dite')" style="background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px;">👶 Dítě</button>
        <button onclick="setDifficulty('dospely')" style="background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px;">👨 Dospělý</button>
        <button onclick="setDifficulty('opilec')" style="background: #f59e0b; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px;">🥴 Opilec</button>
        <button onclick="setDifficulty('nemozne')" style="background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px;">💀 Nemožné</button>
    </div>

    <div class="controls">Stiskni <strong>MEZERNIK</strong> nebo <strong>KLIKNI</strong> pro skok!</div>

<script>
// HLAVNÍ NASTAVENÍ PROHLÍŽEČE A PLÁTNA
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// DEFINICE LEVELŮ S DOČASNÝMI LIMITI (PŘENASTAVÍ SE PODLE OBTÍŽNOSTI)
const LEVELS = [
    { name: "LEVEL 1: Milánek běží životem 🐱", target: 10 },
    { name: "LEVEL 2: Milánek na rozlučce se svobodou 🍻", target: 25 }, 
    { name: "LEVEL 3: Běh k oltáři 💒", target: 35 }, 
    { name: "LEVEL 4: Běh životem 🍼🏡🐱", target: 45 },
    { name: "LEVEL 5: Nekonečné manželství! ♾️❤️", target: Infinity }
];

// STAVOVÉ PROMĚNNÉ PRO CHOD ENGNEU
let currentLevel = 0;
let gameActive = false;
let gameOver = false;
let gameWon = false;
let score = 0;
let obstacles = [];
let spawnTimer = 0;
let hue = 0;
let attempts = 1;
let drunkJumpCount = 0;
let drunkSpeedModifier = 1.0;

// GLOBÁLNÍ PROMĚNNÉ PRO REKORDY A DYNAMICKÉ OBTÍŽNOSTI
let highScore = 0;
let highScoreName = "Nikdo";
let selectedDifficulty = "dospely";
// ============================================================================
// 🎵 AUDIO OBJEKTY (HUDBA A ZVUKY)
// ============================================================================
const introMusic = new Audio("intro.mp3");
introMusic.volume = 1.0; // Intro hraje na 100 % hlasitost

const bgMusic = new Audio("hudba.mp3");
bgMusic.loop = true; // Hlavní hudba pojede ve smyčce
bgMusic.volume = 0.4; // Hudba hraje na pozadí na 40 % hlasitost

const starSound = new Audio("hvezda.mp3");
starSound.volume = 0.6;

const gameOverSound = new Audio("konec.mp3");
gameOverSound.volume = 0.5;

const uwuSound = new Audio("uwu.mp3");
uwuSound.volume = 1.0;

const jumpSound = new Audio("skok.mp3");
jumpSound.volume = 0.3;

const jumpDrunkSound = new Audio("skokopilec.mp3");
jumpDrunkSound.volume = 0.4;

// ============================================================================
// 📸 OBRÁZKY (HLAVY Z GITHUB REPOZITÁŘE S KONTROLOU NAČTENÍ)
// ============================================================================
let milanLoaded = false;
let vercaLoaded = false;

const milanHlava = new Image();
milanHlava.onload = function() { milanLoaded = true; };
milanHlava.src = "milan.png"; // Ujisti se, že na GitHubu je přesně velký název milan.png

const vercaHlava = new Image();
vercaHlava.src = "verca.png"; // Ujisti se, že na GitHubu je přesně velký název verca.png
vercaHlava.onload = function() { vercaLoaded = true; };

// Hlídač, aby UWU zvuk nezazněl v Levelu 5 víckrát než jednou za hru
let babySoundPlayed = false;


// 🔥 OPRAVENO: Tento blok byl kompletně smazán:
// introMusic.addEventListener("ended", function() { ... });
// Už zde nic neresetuje hudbu po skončení intra!

let babyTargetScore = 65; // Dynamicky upraveno později
// ============================================================================
// ⚙️ FUNKCE PRO DYNAMICKÉ NASTAVENÍ OBTÍŽNOSTI (KLIKNUTÍ NA TLAČÍTKO)
// ============================================================================
function setDifficulty(type) {
    selectedDifficulty = type;
    
    // 1. Nastavení gravitace (pro opilce slabší plachtění a pomalejší dopad)
    let g = 0.6;
    if (type === "opilec") { 
        g = 0.4; // Extra pomalé plachtění pro LEVEL 1
    }
    milanek.gravity = g;
    verca.gravity = g;
    stela.gravity = g;
    mimino.gravity = g;
    holcicka.gravity = g; // Nastavení gravitace i pro holčičku
    
    // 2. NASTAVENÍ BODOVÝCH LIMITŮ PRO ÚROVNĚ PODLE TVÝCH TABULEK
    LEVELS[0].target = 10; // LEVEL 1 trvá vždy přesně 10 bodů pro všechny
    
    if (type === "dite") {
        LEVELS[1].target = 10 + 15; // Cíl pro konec LEVELU 2 je 25 bodů
        LEVELS[2].target = 25 + 15; // Cíl pro konec LEVELU 3 je 40 bodů
        LEVELS[3].target = 40 + 15; // Cíl pro konec LEVELU 4 je 55 bodů
    } else if (type === "dospely") {
        LEVELS[1].target = 10 + 15; // Cíl pro konec LEVELU 2 je 25 bodů
        LEVELS[2].target = 25 + 10; // Cíl pro konec LEVELU 3 je 35 bodů
        LEVELS[3].target = 35 + 10; // Cíl pro konec LEVELU 4 je 45 bodů
    } else if (type === "opilec") {
        LEVELS[1].target = 10 + 5;  // Cíl pro konec LEVELU 2 je 15 bodů
        LEVELS[2].target = 15 + 15; // Cíl pro konec LEVELU 3 je 30 bodů
        LEVELS[3].target = 30 + 10; // Cíl pro konec LEVELU 4 je 40 bodů
    } else if (type === "nemozne") {
        LEVELS[1].target = 10 + 10; // Cíl pro konec LEVELU 2 je 20 bodů
        LEVELS[2].target = 20 + 10; // Cíl pro konec LEVELU 3 je 30 bodů
        LEVELS[3].target = 30 + 10; // Cíl pro konec LEVELU 4 je 40 bodů
    }
    
    // Miminko vyběhne vždy přesně o 20 bodů později, než končí LEVEL 4
    babyTargetScore = LEVELS[3].target + 20;
    
    // 🚀 OPRAVENO: Voláme rovnou startNewGame() namísto handleAction()
    // To zabrání tomu, aby hra hned po kliknutí spadla do modré smrti
    startNewGame();
}
// ============================================================================
// 🤵 OBJEKT ŽENICHA: MILÁNEK
// ============================================================================
const milanek = {
    x: 40,
    y: 300,
    width: 35,
    height: 60,
    velocity: 0,
    gravity: 0.6,
    lift: -12,
    isJumping: false,
    
    update() {
        if (gameActive === false || gameOver === true || gameWon === true) {
            return;
        }
        this.velocity = this.velocity + this.gravity;
        this.y = this.y + this.velocity;
        if (this.y > 300) {
            this.y = 300;
            this.velocity = 0;
            this.isJumping = false;
        }
    },
    
    jump() {
        if (this.isJumping === false) {
            this.velocity = this.lift;
            this.isJumping = true;
        }
    },
    
    draw() {
        ctx.save();
        // Sako
        ctx.fillStyle = "#1e293b";
        ctx.fillRect(this.x + 4, this.y + 20, 27, 28);
        // Košile (bílý výstřih)
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(this.x + 13.5, this.y + 20);
        ctx.lineTo(this.x + 21.5, this.y + 20);
        ctx.lineTo(this.x + 17.5, this.y + 28);
        ctx.fill();
        // Růžový motýlek
        ctx.fillStyle = "#d63384";
        ctx.beginPath();
        ctx.moveTo(this.x + 13.5, this.y + 22);
        ctx.lineTo(this.x + 21.5, this.y + 26);
        ctx.lineTo(this.x + 21.5, this.y + 22);
        ctx.lineTo(this.x + 13.5, this.y + 26);
        ctx.fill();
        // Kalhoty a boty
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(this.x + 6, this.y + 48, 7, 12);
        ctx.fillRect(this.x + 22, this.y + 48, 7, 12);
        
        // 📸 FOTKA MÍSTO HLAVY (vykreslí se, jen když je fotka úspěšně načtená z GitHubu)
        if (milanLoaded) {
            ctx.drawImage(milanHlava, this.x + 2.5, this.y - 10, 30, 30);
        } else {
            // Záložní kreslená hlava, kdyby GitHub měl zrovna výpadek
            ctx.fillStyle = "#ffdbac";
            ctx.beginPath();
            ctx.arc(this.x + 17.5, this.y + 10, 10, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
};

// ============================================================================
// 👰 OBJEKT NEVĚSTY: VERČA
// ============================================================================
const verca = {
    x: 100,
    y: 300,
    width: 40,
    height: 60,
    velocity: 0,
    gravity: 0.6,
    lift: -12,
    isJumping: false,
    
    update() {
        if (gameActive === false || gameOver === true || gameWon === true) {
            return;
        }
        this.velocity = this.velocity + this.gravity;
        this.y = this.y + this.velocity;
        if (this.y > 300) {
            this.y = 300;
            this.velocity = 0;
            this.isJumping = false;
        }
    },
    
    jump() {
        if (this.isJumping === false) {
            this.velocity = this.lift;
            this.isJumping = true;
        }
    },
    
    draw() {
        ctx.save();
        // Svatební šaty (překrásný zářivě bílý trojúhelník)
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(this.x + 10, this.y + 20);
        ctx.lineTo(this.x + 30, this.y + 20);
        ctx.lineTo(this.x + 40, this.y + 60);
        ctx.lineTo(this.x, this.y + 60);
        ctx.closePath();
        ctx.fill();
        // Růžový pásek na šatech
        ctx.fillStyle = "#d63384";
        ctx.fillRect(this.x + 8, this.y + 30, 24, 4);
        
        // 📸 FOTKA MÍSTO HLAVY (vykreslí se, jen když je fotka úspěšně načtená z GitHubu)
        if (vercaLoaded) {
            ctx.drawImage(vercaHlava, this.x + 5, this.y - 10, 30, 30);
        } else {
            // Záložní kreslená hlava pro případ výpadku
            ctx.fillStyle = "#ffdbac";
            ctx.beginPath();
            ctx.arc(this.x + 20, this.y + 10, 10, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }
};
// ============================================================================
// 🐱 OBJEKT KOČKY: STELA
// ============================================================================
const stela = {
    x: 120,
    y: 330,
    width: 25,
    height: 25,
    velocity: 0,
    gravity: 0.6,
    lift: -12,
    isJumping: false,
    
    update() {
        if (gameActive === false || gameOver === true || gameWon === true) {
            return;
        }
        this.velocity = this.velocity + this.gravity;
        this.y = this.y + this.velocity;
        if (this.y > 330) {
            this.y = 330;
            this.velocity = 0;
            this.isJumping = false;
        }
    },
    
    jump() {
        if (this.isJumping === false) {
            this.velocity = this.lift;
            this.isJumping = true;
        }
    },
    
    draw() {
        ctx.save();
        ctx.fillStyle = "#64748b";
        ctx.fillRect(this.x, this.y + 8, this.width, 17);
        ctx.fillRect(this.x + 4, this.y, 17, 10);
        // Ouška
        ctx.beginPath();
        ctx.moveTo(this.x + 4, this.y); ctx.lineTo(this.x + 8, this.y - 5); ctx.lineTo(this.x + 10, this.y);
        ctx.moveTo(this.x + 21, this.y); ctx.lineTo(this.x + 17, this.y - 5); ctx.lineTo(this.x + 15, this.y);
        ctx.fill();
        // Vnitřek oušek
        ctx.fillStyle = "#fda4af";
        ctx.beginPath();
        ctx.moveTo(this.x + 5, this.y); ctx.lineTo(this.x + 7, this.y - 3); ctx.lineTo(this.x + 8, this.y);
        ctx.moveTo(this.x + 20, this.y); ctx.lineTo(this.x + 18, this.y - 3); ctx.lineTo(this.x + 17, this.y);
        ctx.fill();
        // Zelené oči
        ctx.fillStyle = "#4ade80";
        ctx.fillRect(this.x + 7, this.y + 3, 3, 3);
        ctx.fillRect(this.x + 15, this.y + 3, 3, 3);
        // Ocásek
        ctx.strokeStyle = "#64748b";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y + 15);
        ctx.quadraticCurveTo(this.x - 8, this.y + 10, this.x - 5, this.y + 2);
        ctx.stroke();
        ctx.restore();
    }
};
// ============================================================================
// 👧 OBJEKT HOLČIČKY: HOLCICKA
// ============================================================================
const holcicka = {
    x: 120,
    y: 320,
    width: 25,
    height: 35,
    velocity: 0,
    gravity: 0.6,
    lift: -12,
    isJumping: false,
    
    update() {
        if (gameActive === false || gameOver === true || gameWon === true) {
            return;
        }
        this.velocity = this.velocity + this.gravity;
        this.y = this.y + this.velocity;
        if (this.y > 320) {
            this.y = 320;
            this.velocity = 0;
            this.isJumping = false;
        }
    },
    
    jump() {
        if (this.isJumping === false) {
            this.velocity = this.lift;
            this.isJumping = true;
        }
    },
    
    draw() {
        ctx.save();
        // Hlavička
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(this.x + 12.5, this.y + 10, 8, 0, Math.PI * 2);
        ctx.fill();
        // Vlasy (culíky)
        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.arc(this.x + 5, this.y + 8, 4, 0, Math.PI * 2);
        ctx.arc(this.x + 20, this.y + 8, 4, 0, Math.PI * 2);
        ctx.fill();
        // Růžové šatičky
        ctx.fillStyle = "#f472b6";
        ctx.beginPath();
        ctx.moveTo(this.x + 5, this.y + 18);
        ctx.lineTo(this.x + 20, this.y + 18);
        ctx.lineTo(this.x + 25, this.y + 35);
        ctx.lineTo(this.x, this.y + 35);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
    }
};

// ============================================================================
// 👶 OBJEKT MIMINKA (PŘIPOJÍ SE V LEVELU 5)
// ============================================================================
const mimino = {
    x: 150,
    y: 335,
    width: 20,
    height: 20,
    velocity: 0,
    gravity: 0.6,
    lift: -12,
    isJumping: false,
    
    update() {
        if (gameActive === false || gameOver === true || gameWon === true) {
            return;
        }
        this.velocity = this.velocity + this.gravity;
        this.y = this.y + this.velocity;
        if (this.y > 335) {
            this.y = 335;
            this.velocity = 0;
            this.isJumping = false;
        }
    },
    
    jump() {
        if (this.isJumping === false) {
            this.velocity = this.lift;
            this.isJumping = true;
        }
    },
    
    draw() {
        ctx.save();
        // Modré dupačky
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(this.x + 3, this.y + 11, 14, 9);
        // Hlavička
        ctx.fillStyle = "#ffdbac";
        ctx.beginPath();
        ctx.arc(this.x + 10, this.y + 5, 6, 0, Math.PI * 2);
        ctx.fill();
        // Vlásky
        ctx.fillStyle = "#6b7280";
        ctx.beginPath();
        ctx.arc(this.x + 10, this.y + 2, 6, Math.PI, 0);
        ctx.fill();
        // Dudlík
        ctx.fillStyle = "#f472b6";
        ctx.beginPath();
        ctx.arc(this.x + 10, this.y + 6, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
};
// ============================================================================
// 🚀 GENERÁTOR PŘEKÁŽEK (PODLE LEVELŮ A OBTÍŽNOSTI)
// ============================================================================
function spawnObstacle() {
    if (gameActive === false || gameOver === true || gameWon === true) {
        return;
    }
    
    const isGround = Math.random() > 0.5;
    let icon = "⚽";
    let pool = [];
    let isStar = Math.random() < 0.15; // 15% šance, že se místo překážky objeví hvězda 💰
    
    if (isStar) {
        icon = "💰"; // Změněno na ikonu coin / mince
    } else {
        if (currentLevel === 0) {
            pool = ["⚽", "👩🏼", "👵🏼", "🍺", "🍔", "🍻", "🍸", "☕", "🥤", "🍭", "🧁", "👩🏼‍🦳"];
        } else if (currentLevel === 1) {
            pool = ["🍾", "🧾", "🍕", "🍟", "🍩", "🍺", "🌭", "🎈", "🕺🏼", "💃🏼"];
        } else if (currentLevel === 2) {
            pool = ["🎂", "🥂", "👵🏼", "👩🏼‍🦳", "👩🏼‍❤️‍👨🏼", "👰🏼‍♀️", "🤵🏼", "🍾", "🍰", "💍"];
        } else {
            pool = ["🍼", "👶🏼", "🧷", "⚡", "🤰🏼", "👩🏼‍❤️‍👨🏼", "🥩", "💎"];
        }
        icon = pool[Math.floor(Math.random() * pool.length)];
    }
    
    // Nastavení základní rychlosti podle zvolené obtížnosti
    let baseSpeed = 5.5;
    if (selectedDifficulty === "dite") { 
        baseSpeed = 4.5; 
    }
    if (selectedDifficulty === "nemozne" || (selectedDifficulty === "opilec" && currentLevel >= 3)) { 
        baseSpeed = 10.5; 
    }
    
    let currentSpeed = baseSpeed + (currentLevel * 0.5);// Extrémní zrychlení pro úroveň Nemožné od LEVELU 2 a výše
    if (selectedDifficulty === "nemozne" && currentLevel >= 1) {
        currentSpeed = 15.5;
    }
    
    // Aplikace střídavé rychlosti pro opilce v LEVELU 3
    if (selectedDifficulty === "opilec" && currentLevel === 2) {
        currentSpeed = currentSpeed * drunkSpeedModifier;
    }
    
    // Zrychlování v Levelu 5 začíná plynule od postupu do 5. levelu
    if (currentLevel === 4 && score > LEVELS[3].target) {
        let extraPoints = score - LEVELS[3].target;
        currentSpeed = currentSpeed + (Math.floor(extraPoints / 10) * 0.3);
    }
    
    let spawnY = 230;
    if (isGround === true) {
        spawnY = 325;
    }
    
    obstacles.push({
        x: canvas.width,
        width: 30,
        height: 30,
        speed: currentSpeed,
        y: spawnY,
        label: icon,
        passed: false,
        isStar: isStar // Uloží informaci, že tento objekt je hvězda
    });
}

// ============================================================================
// 🔄 RESETOVÁNÍ HRY (START NOVÉHO POKUSU)
// ============================================================================
function startNewGame() {
    // Schováme menu s tlačítky, když se aktivně hraje
    document.getElementById("difficultyMenu").style.display = "none";
    
    // RESETUJEME SKLADBY NA ZAČÁTEK
    introMusic.currentTime = 0;
    bgMusic.currentTime = 0;
    babySoundPlayed = false; // Resetuje hlídače pro nový pokus
    mimino.soundPlayed = false; //
    
    // SPUSTÍME INTRO I HLAVNÍ HUDBU SOUČASNĚ OD STARTU (Přesně podle tvého plánu)
    introMusic.play().catch(function(error) { console.log("Intro čeká na kliknutí"); });
    bgMusic.play().catch(function(error) { console.log("Hlavní hudba čeká na kliknutí"); });
    
    obstacles = [];
    score = 0;
    currentLevel = 0;
    spawnTimer = 0;
    
    milanek.y = 300;
    milanek.velocity = 0;
    milanek.isJumping = false;
    
    verca.y = 300;
    verca.velocity = 0;
    verca.isJumping = false;
    
    stela.y = 330;
    stela.velocity = 0;
    stela.isJumping = false;
    
    mimino.y = 335;
    mimino.velocity = 0;
    mimino.isJumping = false;

    // Reset nové postavy holčičky pro nový pokus
    holcicka.y = 320;
    holcicka.velocity = 0;
    holcicka.isJumping = false;
    
    gameOver = false;
    gameWon = false;
    gameActive = true;
}

// ============================================================================
// 📐 MATEMATICKÁ KONTROLA NÁRAZU (KOLIZE)
// ============================================================================
function checkCollision(rect1, rect2) {
    if (rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x && rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y) {
        return true;
    }
    return false;
}

// ============================================================================
// 🎮 HLAVNÍ HERNÍ SMYČKA (1. ČÁST - VYKRESLOVÁNÍ)
// ============================================================================
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Pozadí podle levelu
    if (currentLevel === 0) {
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, "#bae6fd");
        gradient.addColorStop(1, "#e0f2fe");
        ctx.fillStyle = gradient;
    } else if (currentLevel === 1 || (selectedDifficulty === "opilec" && currentLevel >= 3)) {
        // Pokud je to opilec v lvl 4+, přičítá se hue obrovskou rychlostí (např. +15 místo +0.5)
        let speedIncrease = (selectedDifficulty === "opilec" && currentLevel >= 3) ? 15 : 0.5;
        hue = (hue + speedIncrease) % 360;
        ctx.fillStyle = "hsla(" + hue + ", 70%, 80%, 1)";
    } else if (currentLevel === 2) {
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, "#fbcfe8");
        gradient.addColorStop(1, "#fce7f3");
        ctx.fillStyle = gradient;
    } else {
        let gradient = ctx.createLinearGradient(0, 0, 0, 400);
        gradient.addColorStop(0, "#bbf7d0");
        gradient.addColorStop(1, "#dcfce7");
        ctx.fillStyle = gradient;
    }
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Vykreslení zelené trávy
    ctx.fillStyle = "#71bc68";
    ctx.fillRect(0, 360, canvas.width, 40);

    // Aktualizace a zobrazení postav podle levelu (Zarovnaný těsný zástup)
    if (currentLevel === 0) {
        milanek.x = 80;
        milanek.update();
        milanek.draw();
        
        // Pokud je skóre nad 100, Stela zmizí a místo ní běží holčička
        if (score > 100) {
            holcicka.x = 140;
            holcicka.update();
            holcicka.draw();
        } else {
            stela.x = 140;
            stela.update();
            stela.draw();
        }
    } else if (currentLevel === 1) {
        milanek.x = 40;
        verca.x = 350;
        milanek.update();
        milanek.draw();
        verca.update();
        verca.draw();
    } else if (currentLevel === 2) {
        milanek.x = 40;
        verca.x = 100;
        milanek.update();
        milanek.draw();
        verca.update();
        verca.draw();
    } else if (currentLevel === 3 || currentLevel === 4) {
        milanek.x = 40;
        verca.x = 80;
        
        milanek.update();
        milanek.draw();
        verca.update();
        verca.draw();
        
        // Pokud je skóre nad 100, Stela zmizí a místo ní běží holčička
        if (score > 100) {
            holcicka.x = 120;
            holcicka.update();
            holcicka.draw();
        } else {
            stela.x = 120;
            stela.update();
            stela.draw();
        }

        // 🔥 ODSUD BYL KÓD ZVUKU VYMAZÁN 🔥

        // Zobrazení miminka na scéně v Levelu 5
        if (currentLevel === 4 && score > babyTargetScore) {
            mimino.x = 150;
            mimino.update();
            mimino.draw();
        }
    }

    // 🚀 SEM VLOŽTE KÓD PRO ZVUK (Běží pro všechny úrovně a obtížnosti stejně):
    if (score > babyTargetScore) {
        if (!mimino.soundPlayed) {
            if (typeof uwuSound !== "undefined") {
                uwuSound.currentTime = 0;
                uwuSound.play().catch(function(e) { console.log(e); });
            }
            mimino.soundPlayed = true;
        }
    }

    // Vykreslení spodního ukazatele postupu v levelu
    if (LEVELS[currentLevel].target !== Infinity) {
        let progressRatio = score / LEVELS[currentLevel].target;
        ctx.fillStyle = "rgba(214, 51, 132, 0.3)";
        ctx.fillRect(0, 390, canvas.width, 10);
        ctx.fillStyle = "#d63384";
        ctx.fillRect(0, 390, canvas.width * progressRatio, 10);
    } else {
        ctx.fillStyle = "#d63384";
        ctx.font = "14px Arial";
        ctx.textAlign = "center";
        ctx.fillText("♾️ N E K O N E Č N O ♾️", canvas.width / 2, 398);
    }
// ============================================================================
    // 🎮 HLAVNÍ HERNÍ SMYČKA (2. ČÁST - LOGIKA S MIMINKEM A PŘEKÁŽKAMI)
    // ============================================================================
    if (gameActive === true && gameOver === false && gameWon === false) {
        // Dynamické změny fyziky pro obtížnost OPILEC podle levelů
        if (selectedDifficulty === "opilec") {
            if (currentLevel === 1) { 
                milanek.gravity = verca.gravity = stela.gravity = mimino.gravity = holcicka.gravity = 0.6;
                milanek.lift = verca.lift = stela.lift = mimino.lift = holcicka.lift = -12;
            } else if (currentLevel === 2) { 
                milanek.gravity = verca.gravity = stela.gravity = mimino.gravity = holcicka.gravity = 0.2;
                milanek.lift = verca.lift = stela.lift = mimino.lift = holcicka.lift = -12;
            } else if (currentLevel >= 3) { 
                milanek.gravity = verca.gravity = stela.gravity = mimino.gravity = holcicka.gravity = 0.6;
                milanek.lift = verca.lift = stela.lift = mimino.lift = holcicka.lift = -12;
            }
        }
        
        spawnTimer = spawnTimer + 1;
        if (spawnTimer > 90) {
            spawnObstacle();
            spawnTimer = 0;
        }
        
        for (let i = obstacles.length - 1; i >= 0; i = i - 1) {
            let obs = obstacles[i];
            obs.x = obs.x - obs.speed;
            
            // Vykreslení emoji překážky
            ctx.font = "30px Arial";
            ctx.textAlign = "center";
            ctx.fillText(obs.label, obs.x + 15, obs.y + 25);
            
            // Kontrola kolizí
            let hitGroom = checkCollision(milanek, obs);
            let hitBride = (currentLevel > 0) && checkCollision(verca, obs);
            let hitBaby = (currentLevel === 4 && score > babyTargetScore) && checkCollision(mimino, obs);
            
            let hitCat = false;
            if (currentLevel === 0 || currentLevel > 2) {
                if (score > 100) {
                    hitCat = checkCollision(holcicka, obs);
                } else {
                    hitCat = checkCollision(stela, obs);
                }
            }
            
            if (hitGroom === true || hitBride === true || hitCat === true || hitBaby === true) {
                if (obs.isStar === true) {
                    score = score + 5;
                    starSound.currentTime = 0;
                    starSound.play().catch(function(e){});
                    obstacles.splice(i, 1);
                    
                    if (score >= LEVELS[currentLevel].target) {
                        if (currentLevel < LEVELS.length - 1) {
                            currentLevel = currentLevel + 1;
                            obstacles = [];
                        } else {
                            gameWon = true;
                        }
                    }
                    continue; 
                } else {
                    // NÁRAZ: Konec hry
                    gameOver = true;
                    introMusic.pause();
                    bgMusic.pause();
                    gameOverSound.currentTime = 0;
                    gameOverSound.play().catch(function(e){});
                }
            }
            
            // Určení nejvíce vpravo stojící postavy v zástupu
            let rightmostX = milanek.x;
            if (currentLevel === 0) {
                rightmostX = (score > 100) ? holcicka.x : stela.x;
            } else if (currentLevel === 1 || currentLevel === 2) {
                rightmostX = verca.x;
            } else if (currentLevel === 3 || currentLevel === 4) {
                if (currentLevel === 4 && score > babyTargetScore) {
                    rightmostX = mimino.x;
                } else {
                    rightmostX = (score > 100) ? holcicka.x : stela.x;
                }
            }
            
            if (obs.x + obs.width < rightmostX && obs.passed === false) {
                obs.passed = true;
                if (obs.isStar !== true) {
                    score = score + 1;
                    if (score >= LEVELS[currentLevel].target) {
                        if (currentLevel < LEVELS.length - 1) {
                            currentLevel = currentLevel + 1;
                            obstacles = [];
                        } else {
                            gameWon = true;
                        }
                    }
                }
            }
            
            if (obs.x + obs.width < 0) {
                obstacles.splice(i, 1);
            }
        }
    }
    
    // Zobrazení UI a skóre
    ctx.fillStyle = "#212529";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "left";
    ctx.fillText(LEVELS[currentLevel].name, 20, 40);
    
    let targetText = LEVELS[currentLevel].target;
    if (targetText === Infinity) targetText = "♾️";
    ctx.fillText("Skóre: " + score + " / " + targetText, 20, 70);
    
    // START SCREEN
    if (gameActive === false) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "bold 26px Arial";
        ctx.textAlign = "center";
        ctx.fillText("💍 MILÁNEK & VERČA: CESTA K OLTÁŘI 💍", canvas.width / 2, canvas.height / 2 - 30);
        ctx.font = "18px Arial";
        ctx.fillStyle = "#fbcfe8";
        ctx.fillText("Vyber obtížnost níže pro start hry", canvas.width / 2, canvas.height / 2 + 20);
        
        let localRecord = localStorage.getItem("milanVercaHighScore") || 0;
        let localName = localStorage.getItem("milanVercaHighScoreName") || "Nikdo";
        if (localRecord > 0) {
            ctx.fillStyle = "#fef08a";
            ctx.fillText("🏆 REKORD PROHLÍŽEČE: " + localName + " (" + localRecord + " bodů)", canvas.width / 2, canvas.height / 2 + 60);
        }
        document.getElementById("difficultyMenu").style.display = "flex";
    }
    
    // GAME OVER SCREEN
    if (gameOver === true) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 💾 PERMANENTNÍ UKLÁDÁNÍ REKORDU DO PROHLÍŽEČE
        let lastHighScore = localStorage.getItem("milanVercaHighScore") ? parseInt(localStorage.getItem("milanVercaHighScore")) : 0;
        if (score > lastHighScore) {
            localStorage.setItem("milanVercaHighScore", score);
            let jm = prompt("🎉 NOVÝ REKORD! 🎉\nDosáhl jsi " + score + " bodů!\nNapiš své jméno:");
            if (jm !== null && jm.trim() !== "") {
                highScoreName = jm.trim();
            } else {
                highScoreName = "Anonym";
            }
            localStorage.setItem("milanVercaHighScoreName", highScoreName);
            highScore = score;
        } else {
            highScore = lastHighScore;
            highScoreName = localStorage.getItem("milanVercaHighScoreName") || "Hráč";
        }
        
        ctx.textAlign = "center";
        ctx.fillStyle = "#f472b6";
        ctx.font = "italic bold 20px Arial";
        ctx.fillText("Žili spolu šťastně i po smrti... 🕊️❤️", canvas.width / 2, canvas.height / 2 - 35);
        
        ctx.fillStyle = "white";
        ctx.font = "18px Arial";
        ctx.fillText("Tvůj výsledek: " + score + " bodů (Pokus: " + attempts + ")", canvas.width / 2, canvas.height / 2 + 15);
        
        ctx.fillStyle = "#fef08a";
        ctx.font = "bold 18px Arial";
        ctx.fillText("🏆 REKORD: " + highScoreName + " (" + highScore + " bodů)", canvas.width / 2, canvas.height / 2 + 50);
        
        ctx.fillStyle = "#e0f2fe";
        ctx.font = "14px Arial";
        ctx.fillText("Zvol obtížnost níže pro nový pokus", canvas.width / 2, canvas.height / 2 + 95);
        
        document.getElementById("difficultyMenu").style.display = "flex";
    }
    
    // VICTORY SCREEN
    if (gameWon === true) {
        ctx.fillStyle = "rgba(214, 51, 132, 0.9)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.fillStyle = "white";
        ctx.font = "bold 30px Arial";
        ctx.fillText("🎉 VELKÁ SVATBA SE PODAŘILA! 🎉", canvas.width / 2, canvas.height / 2 - 20);
        ctx.font = "20px Arial";
        ctx.fillText("Milánek a Verča došli k oltáři! ❤️", canvas.width / 2, canvas.height / 2 + 30);
        document.getElementById("difficultyMenu").style.display = "flex";
    }
    
    requestAnimationFrame(gameLoop);
}

// ============================================================================
// 🕹️ MECHANIKA OVLÁDÁNÍ SKOKŮ
// ============================================================================
function handleAction() {
    if (gameActive === false || gameOver === true || gameWon === true) {
        return; 
    }

    if (selectedDifficulty === "opilec") {
        jumpDrunkSound.currentTime = 0;
        jumpDrunkSound.play().catch(function(e){});
        
        if (currentLevel === 2) {
            drunkJumpCount++;
            if (drunkJumpCount % 2 === 0) {
                drunkSpeedModifier = (drunkSpeedModifier === 0.5) ? 1.5 : 0.5;
            }
        }
    } else {
        jumpSound.currentTime = 0;
        jumpSound.play().catch(function(e){});
    }    

    // VLNA SKÁKÁNÍ POSTAV
    if (currentLevel === 0) {
        if (score > 100) { 
            holcicka.jump(); 
        } else { 
            stela.jump(); 
        }
        setTimeout(function() { 
            milanek.jump(); 
        }, 120);

    } else if (currentLevel === 1) {
        milanek.jump();
        verca.jump();

    } else if (currentLevel === 2) {
        verca.jump();
        setTimeout(function() { 
            milanek.jump(); 
        }, 120);

    } else if (currentLevel === 3 || currentLevel === 4) {
        if (selectedDifficulty === "nemozne" && score >= 60) {
            milanek.jump();
            verca.jump();
            if (score > 100) { holcicka.jump(); } else { stela.jump(); }
            if (currentLevel === 4 && score > babyTargetScore) {
                mimino.jump();
            }
        } else {
            if (currentLevel === 4 && score > babyTargetScore) {
                mimino.jump();
                setTimeout(function() { 
                    if (score > 100) { holcicka.jump(); } else { stela.jump(); } 
                }, 120);
                setTimeout(function() { verca.jump(); }, 240);
                setTimeout(function() { milanek.jump(); }, 360);
            } else {
                if (score > 100) { holcicka.jump(); } else { stela.jump(); }
                setTimeout(function() { verca.jump(); }, 120);
                setTimeout(function() { milanek.jump(); }, 240);
            }
        }
    }
}

// POSLUCHAČE UDÁLOSTÍ PRO KLÁVESNICI A MYŠ
window.addEventListener("keydown", function(e) {
    if (e.code === "Space") {
        e.preventDefault(); 
        handleAction();
    }
});

canvas.addEventListener("touchstart", function(e) {
    e.preventDefault(); 
    handleAction();
}, { passive: false });

// NABĚHNUTÍ PRVNÍHO SNÍMKU HERNÍ SMYČKY
gameLoop();
</script>

<!-- ============================================================================
     💌 FORMULÁŘ PRO ZÁPIS DO SVATEBNÍ KNIHY REKORDŮ

<div id="formular-skore" style="text-align: center; margin-top: 20px; font-family: sans-serif; color: black;">

<script>
    // Kompletní konfigurace vašeho projektu svatba-ed782
    const firebaseConfig = {
      apiKey: "AIzaSyDn0V7WhLLIlp0l2tviG1EoYnrAX2dpkFU",
      authDomain: "://firebaseapp.com",
      projectId: "svatba-ed782",
      storageBucket: "svatba-ed782.firebasestorage.app",
      messagingSenderId: "789305181707",
      appId: "1:789305181707:web:c83e960f07161e7d2ae90e"
    };

    // Nastartování databáze (značky script výše ji úspěšně připravily)
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    console.log("Firebase úspěšně spuštěna klasickou cestou bez chyb!");

    // Funkce pro načtení tabulky z databáze Google
    async function obnovitTabulku() {
        const tabulkaDiv = document.getElementById("obsah-zebricku");
        try {
            const querySnapshot = await db.collection("zebricek").orderBy("skore", "desc").limit(10).get();
            let hraci = [];
            querySnapshot.forEach((doc) => {
                hraci.push(doc.data());
            });

            if (hraci.length === 0) {
                tabulkaDiv.innerHTML = "<p>Zatím nikdo nehrál. Buď první!</p>";
                return;
            }

            let html = "<table style='width: 100%; border-collapse: collapse; margin-top: 15px;'>";
            html += "<tr style='border-bottom: 2px solid #d4af37; height: 35px;'><th>Místo</th><th>Jméno</th><th>Skóre</th><th>Vzkaz</th></tr>";

            hraci.forEach((hrac, index) => {
                html += `<tr style='border-bottom: 1px solid rgba(0,0,0,0.1); height: 40px;'>`;
                html += `<td style='font-weight: bold;'>${index + 1}.</td>`;
                html += `<td style='text-align: left; padding-left: 10px;'>${hrac.jmeno}</td>`;
                html += `<td style='color: #ff4757; font-weight: bold;'>${hrac.skore} b.</td>`;
                html += `<td style='font-style: italic; color: #333; text-align: left; padding-left: 10px;'>${hrac.vzkaz || ""}</td>`;
                html += `</tr>`;
            });

            html += "</table>";
            tabulkaDiv.innerHTML = html;
        } catch (e) {
            console.error("Chyba při načítání žebříčku:", e);
            tabulkaDiv.innerHTML = "<p>Nepodařilo se načíst výsledky.</p>";
        }
    }

    // Spustíme načtení okamžitě po zapnutí stránky
    obnovitTabulku();

    // Akce po kliknutí na tlačítko "Uložit můj výsledek"
    document.getElementById("tlacitko-odeslat").addEventListener("click", async () => {
        const jmeno = document.getElementById("hrac-jmeno").value.trim();
        const vzkaz = document.getElementById("hrac-vzkaz").value.trim();
        const body = score; // Správně provázáno na body ze hry

        if (jmeno === "") {
            alert("Prosím, zadej své jméno, ať víme, komu gratulovat!");
            return;
        }

        document.getElementById("tlacitko-odeslat").innerText = "Odesílám do databáze...";
        document.getElementById("tlacitko-odeslat").disabled = true;

        try {
            await db.collection("zebricek").add({
                jmeno: jmeno,
                skore: Number(body),
                vzkaz: vzkaz.substring(0, 30),
                datum: new Date()
            });

            alert("Tvůj výsledek i vzkaz byly úspěšně uloženy! Děkujeme.");
            document.getElementById("formular-skore").innerHTML = "<p style='color: #2ed573; font-weight: bold; font-size: 18px;'>Tvoje skóre bylo zapsáno do svatební tabulky rekordů!</p>";
            obnovitTabulku();
        } catch (chyba) {
            console.error("Chyba při ukládání:", chyba);
            alert("Něco se pokazilo. Zkus to prosím znovu.");
            document.getElementById("tlacitko-odeslat").innerText = "Uložit můj výsledek";
            document.getElementById("tlacitko-odeslat").disabled = false;
        }
    });
</script>
</body>
